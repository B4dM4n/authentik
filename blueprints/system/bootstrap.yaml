version: 1
metadata:
  name: authentik Bootstrap
  labels:
    blueprints.goauthentik.io/system-bootstrap: "true"
    blueprints.goauthentik.io/system: "true"
    blueprints.goauthentik.io/description: |
      This blueprint configures the default admin user and group, and configures them for the [Automated install](https://docs.goauthentik.io/docs/install-config/automated-install?utm_source=bootstrap_blueprint).
context:
  username: akadmin
  group_name: authentik Admins
  email: !Env [AUTHENTIK_BOOTSTRAP_EMAIL, "root@example.com"]
  password: !Env [AUTHENTIK_BOOTSTRAP_PASSWORD, null]
  password_file: !Env [AUTHENTIK_BOOTSTRAP_PASSWORD_FILE, null]
  token: !Env [AUTHENTIK_BOOTSTRAP_TOKEN, null]
  token_file: !Env [AUTHENTIK_BOOTSTRAP_TOKEN_FILE, null]
entries:
  - model: authentik_core.group
    state: created
    identifiers:
      name: !Context group_name
    attrs:
      is_superuser: true
    id: admin-group
  - model: authentik_core.user
    state: created
    id: admin-user
    identifiers:
      username: !Context username
    attrs:
      name: authentik Default Admin
      email: !Context email
      groups:
        - !KeyOf admin-group
      password:
        !If [
          !Context password_file,
          !File [!Context password_file],
          !Context password,
        ]
  - model: authentik_core.token
    state: created
    conditions:
      - !Condition [OR, !Context token, !Context token_file]
    identifiers:
      identifier: authentik-bootstrap-token
      intent: api
      expiring: false
      user: !KeyOf admin-user
    attrs:
      key:
        !If [!Context token_file, !File [!Context token_file], !Context token]
